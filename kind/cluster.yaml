# Local cluster used by `make local-up` and by the e2e workflow: one control plane and one worker, so that
# topology spreading and PodDisruptionBudgets behave as on a real cluster. kindnet enforces NetworkPolicies.
# Requires kind >= v0.33.0 (node images are built for a specific kind release).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5

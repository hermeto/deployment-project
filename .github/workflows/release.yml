name: release

# Publishes the go-app image to GitHub Container Registry when a version tag (v1.2.3) is pushed.
# The tag must match the chart appVersion, so the chart default and the published image never diverge.
# Deploying it is a separate, reviewed change: bump image.tag in environments/<env>/values.yaml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    name: build and push ghcr.io/${{ github.repository_owner }}/go-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the chart appVersion
        run: |
          app_version=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2}' charts/go-app/Chart.yaml)
          if [ "${GITHUB_REF_NAME#v}" != "$app_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match appVersion ${app_version} in charts/go-app/Chart.yaml"
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/go-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

# go-app in the prod environment (namespace go-app-prod), merged over charts/go-app/values.yaml.

image:
  tag: "1.0.0"

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 64Mi

# The HPA owns the replica count (needs metrics-server in the cluster to scale on CPU).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

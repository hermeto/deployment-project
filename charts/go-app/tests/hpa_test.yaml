suite: horizontal pod autoscaler
templates:
  - templates/hpa.yaml
release:
  name: go-app
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: scales the Deployment on CPU
    set:
      autoscaling.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: go-app
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 5
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80
      - notExists:
          path: spec.behavior

  - it: adds a memory metric and scaling behavior
    set:
      autoscaling.enabled: true
      autoscaling.targetMemoryUtilizationPercentage: 75
      autoscaling.behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
    asserts:
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 75
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300

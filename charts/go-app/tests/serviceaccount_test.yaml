suite: service account
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
release:
  name: go-app
tests:
  - it: creates a dedicated account without a token
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: go-app
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: uses an existing account when create is false
    set:
      serviceAccount.create: false
      serviceAccount.name: shared
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: shared
        template: templates/deployment.yaml

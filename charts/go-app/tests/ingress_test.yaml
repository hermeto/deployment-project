suite: ingress
templates:
  - templates/ingress.yaml
release:
  name: go-app
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes every host and path to the Service
    set:
      ingress.enabled: true
      ingress.className: nginx
      ingress.hosts:
        - host: app.example.com
          paths:
            - path: /
              pathType: Prefix
      ingress.tls:
        - hosts: [app.example.com]
          secretName: app-tls
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0]
          value:
            host: app.example.com
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: go-app
                      port:
                        name: http
      - equal:
          path: spec.tls[0].secretName
          value: app-tls

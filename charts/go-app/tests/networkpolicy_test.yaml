suite: network policy
templates:
  - templates/networkpolicy.yaml
release:
  name: go-app
tests:
  - it: allows ingress on the HTTP port only and egress to DNS only
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - equal:
          path: spec.ingress
          value:
            - ports:
                - port: http
                  protocol: TCP
      - lengthEqual:
          path: spec.egress
          count: 1
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels
          value:
            k8s-app: kube-dns

  - it: restricts ingress sources and appends egress rules
    set:
      networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      networkPolicy.extraEgress:
        - to:
            - ipBlock:
                cidr: 10.0.0.0/8
          ports:
            - port: 5432
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
      - lengthEqual:
          path: spec.egress
          count: 2
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432

  - it: can be disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

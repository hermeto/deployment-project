# In-cluster Git server used by the e2e test only (scripts/e2e.sh).
#
# The e2e test pushes the working tree under test here and points Argo CD at it, so that a pull request is tested
# end to end through GitOps without pushing anything to GitHub. Anonymous read/write over the git:// protocol:
# never deploy this outside a throwaway cluster. The image is the official Docker "scm" image (git with git-daemon).
apiVersion: v1
kind: Namespace
metadata:
  name: git-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git-server
  labels:
    app.kubernetes.io/name: git-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: buildpack-deps:noble-scm@sha256:4163ac2c58660c533f3cf3d178551287ddd0ac18269ef84f3a382d0698c89254
          command: ["git", "init", "--bare", "--initial-branch=main", "/srv/git/deployment-project.git"]
          env:
            - name: HOME
              value: /tmp
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts: &volumeMounts
            - name: repos
              mountPath: /srv/git
            - name: tmp
              mountPath: /tmp
      containers:
        - name: git-daemon
          image: buildpack-deps:noble-scm@sha256:4163ac2c58660c533f3cf3d178551287ddd0ac18269ef84f3a382d0698c89254
          command:
            - git
            - daemon
            - --reuseaddr
            - --export-all
            - --enable=receive-pack
            - --informative-errors
            - --base-path=/srv/git
            - /srv/git
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: git
              containerPort: 9418
          readinessProbe:
            tcpSocket:
              port: git
            periodSeconds: 2
          securityContext: *securityContext
          volumeMounts: *volumeMounts
      volumes:
        - name: repos
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git-server
spec:
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: git
      port: 9418
      targetPort: git
